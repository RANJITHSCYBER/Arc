; PlatformIO Project Configuration File
; HIZMOS - Multi-Tool for ESP32 Dev Module
; Screen: SH1106 / SSD1306 128x64 OLED (I2C)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

lib_deps =
    olikraus/U8g2@^2.35.19
    nrf24/RF24@^1.4.9
    z3t0/IRremote@^4.4.1
    adafruit/Adafruit NeoPixel@^1.12.3
    t-vk/ESP32 BLE Mouse@^0.3.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
